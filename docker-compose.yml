services:
  jekyll:
    image: kenji-fukushima-lab-site:dev
    build: .
    ports:
      - "8080:8080"
      - "35729:35729"
    volumes:
      - .:/srv/jekyll
      - jekyll-bundle:/usr/local/bundle
    environment:
      JEKYLL_ENV: development
      BUNDLE_FROZEN: "true"
      # Trust only this bind mount, without modifying global Git configuration.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /srv/jekyll

volumes:
  jekyll-bundle:
