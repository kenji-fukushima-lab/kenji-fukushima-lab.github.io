name: "📝 Blog post submission"
description: "研究室ブログ投稿を申請します（外部投稿は承認後に公開）"
title: "Blog post submission"
labels: ["blog-post"]
body:
  - type: markdown
    attributes:
      value: |
        以下のフォームを入力して投稿申請してください。
        Please fill out the form below to submit a blog post request.

        - この Issue と添付画像は公開されます。非公開情報や公開解禁前の内容は記入しないでください。
          This issue and its attachments are public. Do not include private or embargoed material.
        - 本文には Markdown を使ってください。任意の HTML・Liquid・埋め込みコードは使えません。
          Use Markdown in the body. Arbitrary HTML, Liquid, and embed code are not accepted.
        - 画像は「本文」欄にドラッグ&ドロップで添付できます。
          You can drag and drop images into the "本文 / Body" field.
        - 取得できた GitHub 添付画像は `assets/img/posts/` に保存され、本文リンクも置換されます。PR の警告も確認してください。
          Downloaded GitHub image attachments are saved to `assets/img/posts/` and their links rewritten. Check any PR warnings.
        - メンテナ以外からの投稿は、管理者レビュー後に公開されます。
          Submissions from non-maintainers are published only after maintainer review and approval.
        - Issue のタイトルは送信後に自動更新されます。記事タイトルには `記事タイトル / Post Title` が使われます。
          The issue title is updated automatically after submission. `記事タイトル / Post Title` is used as the blog post title.
        - 投稿者は GitHub ユーザー名から自動取得されます（入力不要）。
          Author is automatically derived from your GitHub username.
          例: `kfuku52 (Kenji Fukushima)`（`kfuku52` はプロフィールページへのリンクになります）
          Example: `kfuku52 (Kenji Fukushima)` where `kfuku52` links to the GitHub profile.

  - type: input
    id: post_title
    attributes:
      label: 記事タイトル / Post Title
      placeholder: 例）学会発表を行いました
    validations:
      required: true

  - type: input
    id: post_date
    attributes:
      label: 記事日付 / Article Date (YYYY-MM-DD)
      description: 記事の表示日付です。未来の日付は、その日（日本時間）以降の正常なデプロイまで公開されません。 / Displayed article date; future dates delay visibility until a successful deployment on or after that date in Japan time.
      placeholder: "2026-03-04"
    validations:
      required: true

  - type: dropdown
    id: lang
    attributes:
      label: 言語 / Language
      options:
        - ja
        - en-us
      default: 0
    validations:
      required: true

  - type: input
    id: slug
    attributes:
      label: URLスラッグ / URL Slug（英数字とハイフン、任意 / optional）
      description: 空欄の場合はタイトルから自動生成します / If empty, it will be generated from the title
      placeholder: 例）conference-report-2026
    validations:
      required: false

  - type: textarea
    id: content
    attributes:
      label: 本文 / Body (Markdown)
      description: Markdownで本文を入力してください。画像添付もここで行えます。 / Write the post body in Markdown. You can also attach images here.
      placeholder: |
        ここに本文を書いてください。
        Write your post content here.

        画像を挿入したい場合は、この欄にドラッグ&ドロップしてください。
        To insert images, drag and drop them into this field.
    validations:
      required: true
