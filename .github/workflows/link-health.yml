name: Link health

on:
  workflow_run:
    workflows: [Deploy site]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: link-health-main
  cancel-in-progress: true

jobs:
  links:
    name: Generated external links
    # Never download or execute an untrusted pull-request artifact.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted link-checking tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select tested site artifact
        id: site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: python3 .github/scripts/select_site_artifact.py
      - name: Download tested production site
        if: steps.site.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.site.outputs.run_id }}
          name: ${{ steps.site.outputs.artifact }}
          path: _site
      - name: Include every bibliography URL from the same commit
        if: steps.site.outputs.found == 'true'
        env:
          SITE_SHA: ${{ steps.site.outputs.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "${SITE_SHA}"
          git show "${SITE_SHA}:_bibliography/papers.bib" > "${RUNNER_TEMP}/site-papers.bib"
          python3 .github/scripts/validate_papers_bib.py "${RUNNER_TEMP}/site-papers.bib" --skip-links --export-urls bibliography-links.txt
      - name: Check external links independently of deployment
        if: steps.site.outputs.found == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          format: json
          output: link-health.json
          checkbox: false
          jobSummary: false
          args: >-
            --base-url https://kenji-fukushima-lab.github.io
            --max-retries 3
            --max-concurrency 8
            --accept 100..=103,200..=299,302,403,429
            --user-agent curl/7.54
            --exclude '^https://kenji-fukushima-lab[.]github[.]io(?:/|$)'
            --exclude '^https://(?:www[.])?linkedin[.]com/'
            --exclude '^https://researchmap[.]jp(?:/|$)'
            --exclude '^https://scholar[.]google[.][^/]+/citations'
            --no-progress
            '_site/**/*.html' bibliography-links.txt
      - name: Retain link status and timeout diagnostics
        if: always() && steps.site.outputs.found == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: link-health-${{ steps.site.outputs.sha }}
          path: link-health.json
          if-no-files-found: ignore
          retention-days: 7
