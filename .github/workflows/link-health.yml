name: Link health

on:
  schedule:
    - cron: "43 18 * * *"
  push:
    branches: [main, master]
    paths:
      - "assets/**"
      - "_bibliography/**"
      - "_data/**"
      - "_includes/**"
      - "_layouts/**"
      - "_news/**"
      - "_pages/**"
      - "_plugins/**"
      - "_posts/**"
      - "_profiles/**"
      - "_projects/**"
      - "_sass/**"
      - ".github/scripts/**"
      - ".github/workflows/link-health.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - "requirements-build.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Generated site links
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependencies
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Restore responsive image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .jekyll-cache/imagemagick
          key: imagemagick-${{ runner.os }}-${{ hashFiles('assets/img/**', '_config.yml', '_plugins/imagemagick_guard.rb', '_plugins/responsive_images.rb') }}
          restore-keys: |
            imagemagick-${{ runner.os }}-
      - name: Build generated site
        env:
          JEKYLL_ENV: production
        run: |
          bash .github/scripts/prepare-jekyll-build-env.sh
          bundle exec jekyll build
      - name: Validate sitemap targets
        run: >-
          python3 .github/scripts/validate_generated_sitemap.py
          _site/sitemap.xml
          _site
          --origin https://kenji-fukushima-lab.github.io
      - name: Check generated local links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --offline
            --root-dir _site
            --verbose --no-progress --max-retries 3
            '_site/**/*.html'
      - name: Check generated external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --base-url https://kenji-fukushima-lab.github.io
            --max-retries 3
            --max-concurrency 8
            --accept 100..=103,200..=299,302,403,429
            --user-agent curl/7.54
            --exclude '^https://kenji-fukushima-lab[.]github[.]io(?:/|$)'
            --exclude '^https://(?:www[.])?linkedin[.]com/'
            --exclude '^https://researchmap[.]jp(?:/|$)'
            --exclude '^https://scholar[.]google[.][^/]+/citations'
            --verbose --no-progress
            '_site/**/*.html'
