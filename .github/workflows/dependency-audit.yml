name: Dependency Audit

on:
  push:
    branches: [main, master]
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Audit Ruby dependencies
        run: |
          gem install bundler-audit --version 0.9.3 --no-document
          bundle-audit check --update
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Audit Node.js dependencies
        run: |
          npm ci
          python3 .github/scripts/audit_node_dependencies.py
