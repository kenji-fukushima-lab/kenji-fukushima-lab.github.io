name: Publish due scheduled posts

on:
  # Compatibility entry point for an immediate full publication check.
  # The daily timer lives in deploy.yml so it builds only once.
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

jobs:
  publish_scheduled:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request the tested deployment pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy.yml --repo "${GITHUB_REPOSITORY}" --ref main
