name: Deploy site

on:
  schedule:
    # 08:30 Japan time, including publication of any overdue scheduled posts.
    - cron: "30 23 * * 1-6"
    # Weekly full UI/Lighthouse coverage; other days refresh generated data.
    - cron: "30 23 * * 0"
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      axe_path:
        description: "Optional single path for the accessibility tests (for example: blog/)"
        required: false

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_required: ${{ steps.changes.outputs.checks_required }}
      site_changed: ${{ steps.changes.outputs.site_changed }}
      build_required: ${{ steps.changes.outputs.build_required }}
      browser_required: ${{ steps.changes.outputs.browser_required }}
      lighthouse_required: ${{ steps.changes.outputs.lighthouse_required }}
      lighthouse_urls: ${{ steps.changes.outputs.lighthouse_urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CHECKS: ${{ github.event.schedule == '30 23 * * 0' }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed_paths="${RUNNER_TEMP}/site-ci-changed-paths.txt"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRD "${BASE_SHA}...${HEAD_SHA}" > "${changed_paths}"
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMRD "${BEFORE_SHA}..${HEAD_SHA}" > "${changed_paths}"
          else
            git ls-files > "${changed_paths}"
          fi
          flags=()
          if [ "${FULL_CHECKS}" = "true" ]; then flags+=(--full); fi
          python3 .github/scripts/classify_ci_changes.py --event "${EVENT_NAME}" "${flags[@]}" < "${changed_paths}" >> "${GITHUB_OUTPUT}"
          sed -n '1,200p' "${changed_paths}"

  build:
    name: Fast checks and production build
    needs: preflight
    if: needs.preflight.outputs.checks_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-test.txt
      - name: Install Node.js dependencies
        run: npm ci
      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Python syntax checks
        run: find .github/scripts -name '*.py' -exec python3 -m py_compile {} +
      - name: Unit tests
        run: npm run test:unit
      - name: Validate papers.bib
        run: python3 .github/scripts/validate_papers_bib.py _bibliography/papers.bib --skip-links
      - name: Enforce image size threshold
        run: bash .github/scripts/check-image-budget.sh
      - name: Check formatting
        id: prettier
        continue-on-error: true
        run: npm run prettier
      - name: Create formatting diff
        if: steps.prettier.outcome == 'failure'
        run: |
          npm run prettier:fix
          git diff -- . ':(exclude)package-lock.json' ':(exclude)package.json' > formatting.diff
      - name: Upload formatting diff
        if: steps.prettier.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: formatting-diff
          path: formatting.diff
          retention-days: 7
      - name: Fail on formatting differences
        if: steps.prettier.outcome == 'failure'
        run: exit 1
      - name: Restore responsive image cache
        if: needs.preflight.outputs.build_required == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .jekyll-cache/imagemagick
          key: imagemagick-${{ runner.os }}-${{ hashFiles('assets/img/**', '_config.yml', '_plugins/imagemagick_guard.rb', '_plugins/responsive_images.rb', '_plugins/responsive_image_manifest.rb') }}
          restore-keys: |
            imagemagick-${{ runner.os }}-
      - name: Configure repository metadata
        if: needs.preflight.outputs.build_required == 'true'
        uses: fjogeleit/yaml-update-action@dffe9a5223d84653c13374032382f6bb5de8e5ef # v0.17.0
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Refresh GitHub repository statistics
        if: needs.preflight.outputs.build_required == 'true' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fetch_repo_stats.py
      - name: Build site once
        if: needs.preflight.outputs.build_required == 'true'
        env:
          JEKYLL_ENV: production
        run: |
          bash .github/scripts/prepare-jekyll-build-env.sh
          bundle exec jekyll build
      - name: Write deployment marker
        if: needs.preflight.outputs.build_required == 'true'
        run: printf '%s\n' "${GITHUB_SHA}" > _site/deployment-version.txt
      - name: Validate generated Atom feeds
        if: needs.preflight.outputs.build_required == 'true'
        run: >-
          python3 .github/scripts/validate_generated_feeds.py
          _site/feed.xml
          _site/ja/feed.xml
      - name: Validate generated sitemap
        if: needs.preflight.outputs.build_required == 'true'
        run: >-
          python3 .github/scripts/validate_generated_sitemap.py
          _site/sitemap.xml
          _site
          --origin https://kenji-fukushima-lab.github.io
      - name: Validate responsive image dimensions
        if: needs.preflight.outputs.build_required == 'true'
        run: python3 .github/scripts/validate_responsive_images.py _site
      - name: Purge unused CSS
        if: needs.preflight.outputs.build_required == 'true'
        run: npm run css:purge
      - name: Check generated local links
        if: needs.preflight.outputs.build_required == 'true'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          args: >-
            --offline
            --root-dir _site
            --verbose --no-progress --max-retries 3
            '_site/**/*.html'
      - name: Upload production site
        if: needs.preflight.outputs.build_required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-site-${{ github.sha }}
          path: _site
          compression-level: 0
          retention-days: 1

  browser:
    name: UI and accessibility
    needs: [preflight, build]
    if: needs.preflight.outputs.browser_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download production site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-site-${{ github.sha }}
          path: _site
      - name: Run browser tests
        env:
          AXE_PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.axe_path || '' }}
        run: npm run test:ui
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: Lighthouse
    needs: [preflight, build]
    if: needs.preflight.outputs.lighthouse_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Download production site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-site-${{ github.sha }}
          path: _site
      - name: Run Lighthouse assertions
        env:
          LHCI_URL_PATHS: ${{ needs.preflight.outputs.lighthouse_urls }}
          LHCI_NUMBER_OF_RUNS: "3"
        run: npm run test:lighthouse
      - name: Upload Lighthouse failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-failure-${{ github.sha }}
          path: lighthouse-results-ci
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy
    needs: [preflight, build, browser, lighthouse]
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.preflight.outputs.site_changed == 'true' &&
      needs.preflight.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.browser.result == 'success' || needs.browser.result == 'skipped') &&
      (needs.lighthouse.result == 'success' || needs.lighthouse.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Download tested production site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-site-${{ github.sha }}
          path: _site
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: _site
      - name: Verify public deployment
        env:
          PUBLIC_SITE_URL: https://kenji-fukushima-lab.github.io
        run: >-
          python3 .github/scripts/verify_public_deployment.py
          --base-url "${PUBLIC_SITE_URL}"
          --expected-sha "${GITHUB_SHA}"
