name: Axe accessibility testing

on:
  # Enabled accessibility testing on every push and PR
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_plugins/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/**.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/scripts/prepare-jekyll-build-env.sh"
      - ".github/workflows/axe.yml"
      - "!lighthouse_results/**"
      - "!lighthouse-results-ci/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "_sass/**"
      - "_plugins/**"
      - "**.bib"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/**.md"
      - "**.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/scripts/prepare-jekyll-build-env.sh"
      - ".github/workflows/axe.yml"
      - "!lighthouse_results/**"
      - "!lighthouse-results-ci/**"
      - "!CONTRIBUTING.md"
      - "!CUSTOMIZE.md"
      - "!FAQ.md"
      - "!INSTALL.md"
      - "!README.md"
  workflow_dispatch:
    inputs:
      url:
        description: "URL to be checked (e.g.: blog/)"
        required: false

env:
  URL: ""

concurrency:
  group: axe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install accessibility tools
        run: npm ci
      - name: Update _config.yml ⚙️
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          changes: |
            {
              "giscus.repo": "${{ github.repository }}",
              "baseurl": ""
            }
      - name: Install and Build 🔧
        run: |
          bash .github/scripts/prepare-jekyll-build-env.sh
          export JEKYLL_ENV=production
          bundle exec jekyll build
      - name: Setup Chrome 🌐
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Run axe 🪓
        run: |
          python3 -m http.server 8080 --directory _site &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/ >/dev/null
          if [ -n "${{ github.event.inputs.url || env.URL }}" ]; then
            paths=("${{ github.event.inputs.url || env.URL }}")
          else
            paths=("" "publications/" "resources/" "outreach/" "join/" "ja/" "ja/publications/" "ja/resources/" "ja/outreach/" "ja/join/")
          fi
          urls=()
          for path in "${paths[@]}"; do
            urls+=("http://localhost:8080/${path}")
          done
          node .github/scripts/run-axe.mjs "${{ steps.setup-chrome.outputs.chrome-path }}" "${urls[@]}"
