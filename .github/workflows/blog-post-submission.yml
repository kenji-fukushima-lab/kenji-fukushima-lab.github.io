name: Create blog post PR from submission issue

on:
  issues:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-blog-post-pr:
    if: contains(github.event.issue.body || '', '### 記事タイトル / Post Title')
    runs-on: ubuntu-latest
    steps:
      - name: Ensure blog-post label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const labelName = "blog-post";
            const labelColor = "1D76DB";
            const labelDescription = "Blog submission issues";

            try {
              await github.rest.issues.getLabel({
                owner,
                repo,
                name: labelName,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              await github.rest.issues.createLabel({
                owner,
                repo,
                name: labelName,
                color: labelColor,
                description: labelDescription,
              });
            }

            const existingLabels = (context.payload.issue.labels || []).map((label) => label.name);
            if (!existingLabels.includes(labelName)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [labelName],
              });
            }

      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python 🐍
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: "npm"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Generate post markdown and download attachments
        id: generate
        continue-on-error: true
        env:
          MAX_IMAGE_BYTES: "900000"
        run: python .github/scripts/create_blog_post_from_issue.py

      - name: Format generated post
        if: steps.generate.outcome == 'success'
        run: npx prettier "${{ steps.generate.outputs.generated_post }}" --write

      - name: Comment issue when generation fails
        if: steps.generate.outcome == 'failure'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            投稿の自動処理に失敗しました。入力内容を確認して Issue を編集してください。

            想定される原因:
            - 投稿日の形式が `YYYY-MM-DD` ではない
            - 必須項目が空欄
            - 本文セクションが欠落している

            修正後に Issue を保存すると再実行されます。

      - name: Stop workflow when generation fails
        if: steps.generate.outcome == 'failure'
        run: exit 1

      - name: Update issue title
        if: steps.generate.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_TITLE: ${{ steps.generate.outputs.issue_title }}
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              title: process.env.ISSUE_TITLE,
            });

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.generate.outputs.commit_message }}
          title: ${{ steps.generate.outputs.pr_title }}
          body: ${{ steps.generate.outputs.pr_body }}
          branch: ${{ steps.generate.outputs.branch_name }}
          base: main
          delete-branch: true
          assignees: kfuku52

      - name: Request maintainer review
        if: steps.cpr.outputs.pull-request-number != '' && github.event.issue.user.login != 'kfuku52'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number("${{ steps.cpr.outputs.pull-request-number }}"),
              reviewers: ["kfuku52"],
            });

      - name: Comment issue with PR link
        if: steps.cpr.outputs.pull-request-url != ''
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ steps.generate.outputs.issue_number }}
          body: |
            投稿ありがとうございます。レビュー用のPRを作成しました。
            ${{ steps.cpr.outputs.pull-request-url }}

            画像添付がある場合は、`assets/img/posts/` への保存、本文リンク置換、向き補正、容量最適化を自動実行しています。
